// ── Current Firebase user uid (global, updated by onAuthStateChanged) ──
window.__sfUid=null;

// ── Persistence helper ──
// usePersist(key, defaultValue) — reads/writes localStorage AND syncs to Firestore
// when a user is signed in. Cloud data wins on first load after sign-in.
function usePersist(key,def){
  var full="sf:"+key;
  function load(){
    try{var v=localStorage.getItem(full);return v!==null?JSON.parse(v):def;}
    catch(e){return def;}
  }
  var pair=useState(load);
  var val=pair[0],setVal=pair[1];
  var initialSyncDone=useRef(false);

  // Write to localStorage on every change
  useEffect(function(){
    try{localStorage.setItem(full,JSON.stringify(val));}
    catch(e){}
  },[val]);

  // Write to Firestore whenever value changes and user is signed in
  useEffect(function(){
    if(!initialSyncDone.current)return; // don't write during initial cloud pull
    var uid=window.__sfUid;
    if(!uid||!window.__FB)return;
    var fb=window.__FB;
    fb.setDoc(fb.doc(fb.db,"users",uid,"data","appData"),{[key]:val},{merge:true})
      .catch(function(e){console.warn("Cloud sync write failed:",key,e);});
  },[val]);

  return [val,function(newVal){
    initialSyncDone.current=true;
    setVal(newVal);
  }];
}

// ── Pull all user data from Firestore after sign-in ──
function pullCloudData(uid,setters){
  if(!uid||!window.__FB)return;
  var fb=window.__FB;
  fb.getDoc(fb.doc(fb.db,"users",uid,"data","appData")).then(function(snap){
    if(!snap.exists())return;
    var d=snap.data();
    // Apply each field to its setter if present
    Object.keys(setters).forEach(function(k){
      if(d[k]!==undefined){
        try{localStorage.setItem("sf:"+k,JSON.stringify(d[k]));}catch(e){}
        setters[k](d[k]);
      }
    });
  }).catch(function(e){console.warn("Cloud pull failed:",e);});
}

// ── Shared Components ──
function GlowRing({pct,size,stroke,grad,label,sub}){
  size=size||90; stroke=stroke||9;
  const r=(size-stroke)/2,circ=2*Math.PI*r;
  const id="gr"+Math.random().toString(36).slice(2);
  return(
    <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <defs><linearGradient id={id} x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stopColor={grad[0]}/><stop offset="100%" stopColor={grad[1]}/>
        </linearGradient></defs>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#1E2640" strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={"url(#"+id+")"} strokeWidth={stroke}
          strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} strokeLinecap="round"/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
        <div style={{fontSize:size*0.2,fontWeight:900,background:"linear-gradient(135deg,"+grad[0]+","+grad[1]+")",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",lineHeight:1}}>{label}</div>
        {sub&&<div style={{fontSize:size*0.11,color:C.muted,marginTop:1}}>{sub}</div>}
      </div>
    </div>
  );
}

function Pill({color,bg,children}){

function GlassCard({children,style}){

function BarChart({data,labels,height,goal}){
  height=height||90;
  const mx=Math.max(...data);
  const mxi=data.indexOf(mx);
  const GOAL=goal||10000;
  const labelH=16;
  const valH=18;
  const barArea=height;
  // goal line position
  const goalY=Math.round((GOAL/mx)*barArea);
  return(
    <div style={{display:"flex",flexDirection:"column",gap:0}}>
      {/* value labels row */}
      <div style={{display:"flex",alignItems:"flex-end",gap:3,height:valH,marginBottom:4}}>
        {data.map(function(v,i){
          const metGoal=v>=GOAL;
          return(
            <div key={i} style={{flex:1,textAlign:"center",fontSize:7.5,fontWeight:700,
              color:metGoal?"#4ADE80":"#F97316",letterSpacing:-0.3}}>
              {v>=10000?(v/1000).toFixed(1)+"k":v.toLocaleString()}
            </div>
          );
        })}
      </div>
      {/* bars + goal line */}
      <div style={{display:"flex",alignItems:"flex-end",gap:3,height:barArea,position:"relative"}}>
        {/* goal line */}
        <div style={{position:"absolute",left:0,right:0,bottom:goalY,pointerEvents:"none",zIndex:2}}>
          <div style={{borderTop:"1.5px solid #4ADE8088",width:"100%"}}/>
        </div>
        {data.map(function(v,i){
          const h=Math.round((v/mx)*barArea);
          const metGoal=v>=GOAL;
          const isBest=i===mxi;
          const barGrad=metGoal
            ?"linear-gradient(180deg,#6EF29A,#22C55E,#16A34A)"
            :"linear-gradient(180deg,#FB923C,#F97316,#EA580C)";
          const glowCol=metGoal?"#22C55E":"#F97316";
          return(
            <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-end",height:"100%",position:"relative"}}>
              <div style={{
                width:"100%",height:h,borderRadius:"5px 5px 0 0",
                background:barGrad,
                boxShadow:"0 -3px 12px "+glowCol+(isBest?"55":"22"),
                position:"relative",overflow:"hidden"
              }}>
                <div style={{position:"absolute",top:0,left:0,right:0,height:"35%",background:"linear-gradient(180deg,rgba(255,255,255,0.18),transparent)",borderRadius:"5px 5px 0 0"}}/>
              </div>
            </div>
          );
        })}
      </div>
      {/* labels row */}
      {labels&&<div style={{display:"flex",alignItems:"center",gap:3,height:labelH,marginTop:5}}>
        {labels.map(function(l,i){
          const metGoal=data[i]>=GOAL;
          return(
            <div key={i} style={{flex:1,textAlign:"center",fontSize:9,fontWeight:metGoal?800:500,
              color:metGoal?"#4ADE80":"#94A3B8"}}>
              {l}
            </div>
          );
        })}
      </div>}
    </div>
  );
}

function SparkLine({data,color1,color2,height}){
  height=height||70;
  const w=320,mx=Math.max(...data),mn=Math.min(...data);
  const pts=data.map(function(v,i){
    const x=i/(data.length-1)*w;
    const y=height-((v-mn)/(mx-mn||1))*(height-10)-5;
    return x+","+y;
  }).join(" ");
  const areaClose=" "+w+","+(height)+" 0,"+height;
  const id="sl"+Math.random().toString(36).slice(2);
  return(
    <svg width="100%" viewBox={"0 0 "+w+" "+height} preserveAspectRatio="none">
      <defs>
        <linearGradient id={id} x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stopColor={color1}/><stop offset="100%" stopColor={color2||color1}/>
        </linearGradient>
        <linearGradient id={id+"a"} x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stopColor={color1} stopOpacity="0.3"/><stop offset="100%" stopColor={color1} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <polygon points={pts+" "+areaClose} fill={"url(#"+id+"a)"}/>
      <polyline points={pts} fill="none" stroke={"url(#"+id+")"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

var GOOGLE_CLIENT_ID="824322486194-mhm0bphtf267bdf3tj22ehqck9lj9p3v.apps.googleusercontent.com";
function LoginScreen({onDone}){
  const [error,setError]=useState("");
  const [loading,setLoading]=useState(false);
  const googleBtnRef=useRef(null);

  useEffect(function(){
    // Wait for Firebase + Google GSI both ready
    function tryInit(){
      if(!window.__FB||!window.google||!window.google.accounts){setTimeout(tryInit,300);return;}
      var{auth,db,GoogleAuthProvider,signInWithCredential,doc,setDoc,serverTimestamp}=window.__FB;
      window.google.accounts.id.initialize({
        client_id:GOOGLE_CLIENT_ID,
        callback:function(response){
          setLoading(true);
          try{
            // Sign in to Firebase with the Google credential
            var credential=GoogleAuthProvider.credential(response.credential);
            signInWithCredential(auth,credential).then(function(result){
              var user=result.user;
              // Save user to Firestore users collection
              setDoc(doc(db,"users",user.uid),{
                uid:user.uid,
                name:user.displayName||"",
                email:user.email||"",
                avatar:user.photoURL||"",
                lastLogin:serverTimestamp(),
                platform:"web"
              },{merge:true}).catch(function(e){console.warn("Firestore write failed:",e);});
              // Also cache locally for fast access
              try{localStorage.setItem("sf:googleUser",JSON.stringify({name:user.displayName,email:user.email,avatar:user.photoURL,uid:user.uid}));}catch(e){}
              setLoading(false);
              onDone();
            }).catch(function(e){
              setError("Sign-in failed: "+e.message);
              setLoading(false);
            });
          }catch(e){setError("Sign-in failed. Try again.");setLoading(false);}
        }
      });
      if(googleBtnRef.current){
        window.google.accounts.id.renderButton(googleBtnRef.current,{
          theme:"outline",size:"large",shape:"pill",width:300,text:"continue_with"
        });
      }
    }
    tryInit();
  },[]);

  return(
    <div style={{minHeight:"100vh",background:C.bg,padding:"60px 24px 40px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>

        <div style={{color:C.muted,fontSize:14}}>Sign in with Google to get started</div>
      </div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16,width:"100%",maxWidth:320}}>
        {loading
          ?<div style={{color:C.green,fontSize:15,fontWeight:700}}>✅ Signing you in…</div>
          :<div ref={googleBtnRef} style={{minHeight:48,display:"flex",justifyContent:"center",width:"100%"}}></div>

function PermissionsScreen({onDone}){
  const perms=[
    {icon:"🏃",l:"Motion & Fitness",desc:"Step count, workouts, activity rings",c:C.green},
    {icon:"❤️",l:"Heart Rate",desc:"Real-time BPM and cardio zones",c:C.pink},
    {icon:"📍",l:"Location (GPS)",desc:"Route tracking and map features",c:C.cyan},
    {icon:"📱",l:"Notifications",desc:"Workout reminders and goal alerts",c:C.amber}
  ];
  const [granted,setGranted]=useState([false,false,false,false]);
  const allGranted=granted.every(function(g){return g;});

  function toggle(i){
    setGranted(function(prev){
      const next=prev.slice();
      next[i]=!next[i];
      return next;
    });
  }

  function allowAll(){
    setGranted([true,true,true,true]);
  }

  return(
    <div style={{minHeight:"100vh",background:C.bg,padding:"50px 24px 40px",display:"flex",flexDirection:"column"}}>
      <div style={{fontSize:11,color:C.muted,fontWeight:700,letterSpacing:1,marginBottom:8}}>STEP 2 OF 2</div>

        <button onClick={allowAll} style={{background:"none",border:"none",color:C.cyan,fontSize:12,fontWeight:700,cursor:"pointer",letterSpacing:0.3,padding:"4px 0"}}>Allow All</button>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:40}}>
        {perms.map(function(p,i){
          const on=granted[i];
          return(
            <div key={i} onClick={function(){toggle(i);}} style={{
              display:"flex",alignItems:"center",gap:14,padding:"16px",borderRadius:18,
              background:on?"linear-gradient(135deg,"+p.c+"18,"+p.c+"08)":C.card,

              boxShadow:on?"0 0 18px "+p.c+"22":"none",

              <div style={{
                width:48,height:48,borderRadius:14,
                background:on?p.c+"22":"#1565C0",

                display:"flex",alignItems:"center",justifyContent:"center",
                fontSize:24,flexShrink:0,
                boxShadow:on?"0 0 12px "+p.c+"44":"none",
                transition:"all 0.2s"
              }}>{p.icon}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:700,color:on?C.text:C.muted,marginBottom:2}}>{p.l}</div>
                <div style={{fontSize:11,color:C.dim}}>{p.desc}</div>
              </div>
              {/* Toggle pill */}
              <div onClick={function(e){e.stopPropagation();toggle(i);}} style={{
                width:52,height:28,borderRadius:14,
                background:on?p.c:"#1565C0",
                border:"1px solid "+(on?p.c:C.border),
                position:"relative",cursor:"pointer",
                boxShadow:on?"0 0 10px "+p.c+"66":"none",
                transition:"all 0.25s",flexShrink:0
              }}>
                <div style={{
                  position:"absolute",top:3,
                  left:on?26:3,
                  width:20,height:20,borderRadius:10,
                  background:on?"#0D47A1":"#1976D2",

                }}/>
              </div>
            </div>
          );
        })}
      </div>
      <div style={{marginTop:"auto"}}>
        {!allGranted&&<div style={{textAlign:"center",fontSize:12,color:C.muted,marginBottom:10}}>
          Enable all permissions for the best experience

        </button>

  );

  const pedometerRef=useRef({

    lastStep:0,        // timestamp of last counted step

  });
  useEffect(function(){
    var ALPHA=0.8;        // low-pass filter coefficient (higher = smoother gravity)
    var COOLDOWN=300;     // min ms between steps
    var WINDOW_SIZE=20;   // samples for dynamic threshold
    function onMotion(e){
      var raw=e.accelerationIncludingGravity;
      if(!raw) return;
      var rx=raw.x||0, ry=raw.y||0, rz=raw.z||0;
      var ref=pedometerRef.current;
      // Update gravity estimate via low-pass filter
      ref.gx=ALPHA*ref.gx+(1-ALPHA)*rx;
      ref.gy=ALPHA*ref.gy+(1-ALPHA)*ry;
      ref.gz=ALPHA*ref.gz+(1-ALPHA)*rz;
      // Linear acceleration = raw - gravity
      var ax=rx-ref.gx, ay=ry-ref.gy, az=rz-ref.gz;
      var mag=Math.sqrt(ax*ax+ay*ay+az*az);
      // Maintain rolling window for dynamic threshold
      ref.window.push(mag);
      if(ref.window.length>WINDOW_SIZE) ref.window.shift();
      var avg=ref.window.reduce(function(a,b){return a+b;},0)/ref.window.length;
      var dynThreshold=avg*1.4; // step peak must be 40% above rolling average
      var minThreshold=1.5;     // absolute floor to ignore tiny vibrations
      var threshold=Math.max(dynThreshold,minThreshold);
      var now=Date.now();
      // Peak detection: rising then falling above threshold
      if(mag>ref.prevMag) {
        ref.rising=true;
      } else if(ref.rising&&ref.prevMag>threshold&&(now-ref.lastStep)>COOLDOWN){
        // We just passed a peak above threshold — count it
        ref.rising=false;
        ref.lastStep=now;
        setSteps(function(s){return s+1;});
      } else {
        ref.rising=false;
      }
      ref.prevMag=mag;
    }

    setGpsStatus("acquiring");
    var watchId=navigator.geolocation.watchPosition(
      function(pos){
        setGpsStatus("tracking");
        setGpsCoords(function(prev){
          var newPt={lat:pos.coords.latitude,lng:pos.coords.longitude,ts:Date.now(),acc:pos.coords.accuracy};
          if(prev.length===0) return [newPt];
          var last=prev[prev.length-1];
          // Haversine distance in metres
          var R=6371000;
          var dLat=(newPt.lat-last.lat)*Math.PI/180;
          var dLng=(newPt.lng-last.lng)*Math.PI/180;
          var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(last.lat*Math.PI/180)*Math.cos(newPt.lat*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);

          setGpsDist(function(d){return d+seg;});

        });

              {(function(){

                </button>;

            {/* ── INTERVAL TIMER ── */}
            {(function(){
              var isActive=itMode==="work"||itMode==="rest";

              var totalSec=itMode==="rest"?itCfg.rest:itCfg.work;
              var pct=isActive?(itSec/totalSec):1;

                  </div>

                  {/* Edit config panel */}
                  {itEdit&&!isActive&&!isDone&&(function(){

                        var maxs={work:300,rest:300,rounds:20};
                        var v=Math.max(mins[field],Math.min(maxs[field],c[field]+delta));
                        var n=Object.assign({},c);n[field]=v;return n;
                      });
                    }
                    function fmtS(s){return s>=60?Math.floor(s/60)+"m "+(s%60>0?s%60+"s":""):s+"s";}

                      <div style={{padding:"12px 16px",display:"flex",flexDirection:"column",gap:10}}>

                                <div style={{width:60,textAlign:"center",fontSize:13,fontWeight:800,color:C.text}}>{f.k==="rounds"?itEditCfg[f.k]:fmtS(itEditCfg[f.k])}</div>

                              </div>

                  <div style={{padding:"16px 16px 18px",display:"flex",alignItems:"center",gap:20}}>

                        :(function(){

          var entry={day:today,meal:mealName||mealType,type:mealType,kcal:portionedKcal,protein:portionedP,carbs:portionedC,fat:portionedF,time:new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"})};
          setNutritionLogs(function(nl){return [entry].concat(nl);});
          setShowAddNutrition(false);
          setMealStep("pick");setMealSearch("");setMealName("");setMealKcal("400");setMealProt("25");setMealCarbs("40");setMealFat("12");setPortion(1.0);
        }
        return(
          <div onClick={function(){setShowAddNutrition(false);setMealStep("pick");setMealSearch("");}} style={{position:"fixed",inset:0,zIndex:300,background:"rgba(0,0,0,0.75)",backdropFilter:"blur(8px)",display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
            <div onClick={function(e){e.stopPropagation();}} style={{width:"100%",maxWidth:420,borderRadius:"28px 28px 0 0",background:"linear-gradient(160deg,#0D0A00,#1A1200)",border:"1px solid "+C.amber+"44",maxHeight:"88vh",display:"flex",flexDirection:"column"}}>
              {/* Handle + header */}
              <div style={{padding:"16px 20px 0",flexShrink:0}}>
                <div style={{width:40,height:4,borderRadius:2,background:"rgba(255,255,255,0.15)",margin:"0 auto 16px"}}/>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
                  {mealStep==="edit"&&<button onClick={function(){setMealStep("pick");}} style={{background:"rgba(255,255,255,0.06)",border:"1px solid "+C.border,borderRadius:10,padding:"6px 10px",cursor:"pointer",color:C.muted,fontSize:13,fontWeight:700}}>← Back</button>}
                  <div style={{fontSize:16,fontWeight:900,color:C.text,flex:1}}>{mealStep==="pick"?"Log Meal":"Edit & Confirm"}</div>
                  <button onClick={function(){setShowAddNutrition(false);setMealStep("pick");setMealSearch("");}} style={{background:"transparent",border:"none",color:C.muted,fontSize:20,cursor:"pointer",padding:"4px 8px"}}>✕</button>
                </div>
                {/* Meal type tabs */}
                <div style={{display:"flex",gap:6,marginBottom:14}}>
                  {["Breakfast","Lunch","Dinner","Snack"].map(function(t){
                    var tIcon={Breakfast:"🌅",Lunch:"☀️",Dinner:"🌙",Snack:"🍎"}[t];
                    return <button key={t} onClick={function(){setMealType(t);setMealSearch("");}} style={{flex:1,padding:"8px 4px",borderRadius:12,border:"1px solid "+(mealType===t?C.amber:C.border),background:mealType===t?C.amber+"22":"transparent",color:mealType===t?C.amber:C.muted,fontSize:10,fontWeight:700,cursor:"pointer",lineHeight:1.3}}><div style={{fontSize:16,marginBottom:2}}>{tIcon}</div>{t}</button>;
                  })}
                </div>
              </div>

              {/* STEP 1: Food picker */}
              {mealStep==="pick"&&<div style={{display:"flex",flexDirection:"column",flex:1,minHeight:0}}>
                {/* Search */}
                <div style={{padding:"0 20px 12px",flexShrink:0}}>
                  <input value={mealSearch} onChange={function(e){setMealSearch(e.target.value);}} placeholder={"Search "+mealType.toLowerCase()+" foods…"} style={{width:"100%",padding:"11px 16px",borderRadius:14,border:"1px solid "+C.amber+"44",background:"rgba(255,255,255,0.05)",color:C.text,fontSize:14,outline:"none",boxSizing:"border-box"}}/>
                </div>
                {/* Food list */}
                <div style={{overflowY:"auto",flex:1,padding:"0 20px 24px"}}>
                  {activeList.length===0&&<div style={{textAlign:"center",color:C.dim,padding:"30px 0",fontSize:13}}>No foods found. Try a different search.</div>}
                  {activeList.map(function(f,i){
                    return <div key={i} onClick={function(){pickFood(f);}} style={{display:"flex",alignItems:"center",gap:12,padding:"13px 14px",borderRadius:16,marginBottom:8,background:"rgba(255,255,255,0.04)",border:"1px solid "+C.border,cursor:"pointer",transition:"all 0.15s"}}>
                      <div style={{fontSize:26,flexShrink:0}}>{f.i}</div>
                      <div style={{flex:1}}>
                        <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:2}}>{f.n}</div>
                        <div style={{fontSize:11,color:C.muted}}>P {f.p}g · C {f.c}g · F {f.f}g</div>
                      </div>
                      <div style={{textAlign:"right",flexShrink:0}}>
                        <div style={{fontSize:16,fontWeight:900,color:C.amber}}>{f.kcal}</div>
                        <div style={{fontSize:9,color:C.dim}}>kcal</div>
                      </div>
                    </div>;
                  })}
                  {/* Custom entry */}
                  <div onClick={function(){setMealName("");setMealKcal("0");setMealProt("0");setMealCarbs("0");setMealFat("0");setMealStep("edit");}} style={{display:"flex",alignItems:"center",gap:12,padding:"13px 14px",borderRadius:16,marginBottom:8,background:"rgba(255,255,255,0.02)",border:"1px dashed "+C.amber+"44",cursor:"pointer"}}>
                    <div style={{fontSize:26}}>✏️</div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:700,color:C.amber}}>Custom meal</div>
                      <div style={{fontSize:11,color:C.muted}}>Enter your own nutritional info</div>
                    </div>
                    <div style={{color:C.amber,fontSize:18,fontWeight:700}}>›</div>
                  </div>
                </div>
              </div>}

              {/* STEP 2: Edit & confirm */}
              {mealStep==="edit"&&<div style={{overflowY:"auto",flex:1,padding:"0 20px 28px"}}>
                {/* Meal name */}
                <div style={{borderRadius:16,padding:"14px 16px",background:C.amber+"12",border:"1px solid "+C.amber+"33",marginBottom:16}}>
                  <input value={mealName} onChange={function(e){setMealName(e.target.value);}} placeholder="Meal name…" style={{width:"100%",background:"transparent",border:"none",outline:"none",color:C.text,fontSize:15,fontWeight:700}}/>
                </div>
                {/* Portion size */}
                <div style={{borderRadius:16,padding:"14px 16px",background:"rgba(255,255,255,0.04)",border:"1px solid "+C.border,marginBottom:16}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                    <div style={{fontSize:11,color:C.muted,fontWeight:700,letterSpacing:1}}>PORTION SIZE</div>
                    <div style={{fontSize:16,fontWeight:900,color:C.amber}}>{portion===1?"1 serving":portion<1?(Math.round(portion*100)+"%"):(portion+"x serving")}</div>
                  </div>
                  <input type="range" min="0.25" max="3" step="0.25" value={portion} onChange={function(e){setPortion(parseFloat(e.target.value));}} style={{width:"100%",accentColor:C.amber}}/>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:C.dim,marginTop:4}}>
                    <span>¼</span><span>½</span><span>1x</span><span>1½</span><span>2x</span><span>2½</span><span>3x</span>
                  </div>
                </div>
                {/* Macro preview */}
                <div style={{fontSize:11,color:C.muted,fontWeight:700,letterSpacing:1,marginBottom:12}}>NUTRITION (adjusted for portion)</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}}>
                  {[{l:"Calories",u:"kcal",v:portionedKcal,c:C.amber},{l:"Protein",u:"g",v:portionedP,c:C.green},{l:"Carbs",u:"g",v:portionedC,c:C.blue},{l:"Fat",u:"g",v:portionedF,c:C.red}].map(function(f,i){
                    return <div key={i} style={{borderRadius:14,padding:"12px",background:"rgba(255,255,255,0.04)",border:"1px solid "+f.c+"33",textAlign:"center"}}>
                      <div style={{fontSize:10,color:f.c,fontWeight:700,letterSpacing:0.5,marginBottom:6}}>{f.l.toUpperCase()}</div>
                      <div style={{fontSize:26,fontWeight:900,color:f.c,lineHeight:1}}>{f.v}</div>
                      <div style={{fontSize:10,color:C.dim,marginTop:2}}>{f.u}</div>
                    </div>;
                  })}
                </div>
                <button onClick={saveMeal} style={{width:"100%",padding:"15px",borderRadius:18,border:"none",background:"linear-gradient(135deg,"+C.amber+","+C.red+")",color:"#1A0A00",fontSize:15,fontWeight:900,cursor:"pointer"}}>Add to Log ✓</button>
              </div>}
            </div>
          </div>
        );
      })()}

      {/* ── Add Weight Modal ── */}
      {showAddWeight&&(function(){
        var heightM=(parseFloat(profile.height)||178)/100;
        var wN=parseFloat(wVal);
        var bmiPreview=isNaN(wN)?"—":(Math.round(wN/(heightM*heightM)*10)/10);
        function saveWeight(){
          var n=parseFloat(wVal);
          if(isNaN(n)||n<20||n>300)return;
          var now=new Date();
          var label=now.toLocaleDateString("en-US",{month:"short",day:"numeric"});
          setWeightLogs(function(wl){return wl.concat([{date:label,w:n}]);});
          setProfile(function(p){return Object.assign({},p,{weight:String(n)});});
          setShowAddWeight(false);
        }
        return(
          <div onClick={function(){setShowAddWeight(false);}} style={{position:"fixed",inset:0,zIndex:300,background:"rgba(0,0,0,0.75)",backdropFilter:"blur(8px)",display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
            <div onClick={function(e){e.stopPropagation();}} style={{width:"100%",maxWidth:420,borderRadius:"28px 28px 0 0",background:"linear-gradient(160deg,#140A10,#1C0E18)",border:"1px solid "+C.pink+"44",padding:"24px 20px 40px"}}>
              <div style={{width:40,height:4,borderRadius:2,background:"rgba(255,255,255,0.15)",margin:"0 auto 20px"}}/>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
                <div style={{fontSize:16,fontWeight:900,color:C.text}}>Log Weight</div>
                <div style={{fontSize:12,color:C.muted}}>BMI: <span style={{color:C.pink,fontWeight:700}}>{bmiPreview}</span></div>
              </div>
              <div style={{textAlign:"center",marginBottom:24}}>
                <input value={wVal} onChange={function(e){setWVal(e.target.value);}} type="number" step="0.1" style={{fontSize:48,fontWeight:900,color:C.pink,background:"transparent",border:"none",outline:"none",textAlign:"center",width:"180px"}}/>
                <div style={{fontSize:16,color:C.muted,fontWeight:600}}>kg</div>
              </div>
              <div style={{display:"flex",gap:8,marginBottom:20}}>
                {["-1","-0.5","+0.5","+1"].map(function(d){
                  return <button key={d} onClick={function(){var cur=parseFloat(wVal)||75;setWVal((Math.round((cur+parseFloat(d))*10)/10).toFixed(1));}} style={{flex:1,padding:"10px 0",borderRadius:12,border:"1px solid "+C.border,background:"rgba(255,255,255,0.04)",color:parseFloat(d)>0?C.amber:C.cyan,fontSize:13,fontWeight:700,cursor:"pointer"}}>{d}</button>;
                })}
              </div>
              <div style={{display:"flex",gap:10}}>
                <button onClick={function(){setShowAddWeight(false);}} style={{flex:1,padding:"14px",borderRadius:16,border:"1px solid "+C.border,background:"transparent",color:C.muted,fontSize:14,fontWeight:700,cursor:"pointer"}}>Cancel</button>
                <button onClick={saveWeight} style={{flex:2,padding:"14px",borderRadius:16,border:"none",background:"linear-gradient(135deg,"+C.pink+","+C.amber+")",color:"#1A0005",fontSize:14,fontWeight:900,cursor:"pointer"}}>Save Weight</button>
              </div>
            </div>
          </div>
        );
      })()}

      <style>{"button:active{transform:scale(0.96)}"}</style>
    </div>
  );
}

// ── Root ──
function SomFit(){
  const [screen,setScreen]=useState("splash");
  const [initProfile,setInitProfile]=useState(null);
  var returning=getHasOnboarded();
  // Splash → login (new users) or app (returning signed-in users)
  if(screen==="splash") return <SplashScreen onDone={function(){
    var cached=null;
    try{var s=localStorage.getItem("sf:googleUser");if(s)cached=JSON.parse(s);}catch(e){}
    var isSignedIn=!!window.__sfUid||!!cached;
    if(returning&&isSignedIn) setScreen("app");
    else if(returning&&!isSignedIn) setScreen("login");
    else setScreen("login"); // new user: always login first
  }}/>;
  if(screen==="login") return <LoginScreen onDone={function(){setScreen(returning?"app":"profile");}}/>;
  if(screen==="profile") return <ProfileScreen onDone={function(p){setInitProfile(p);setScreen("permissions");}}/>;
  if(screen==="permissions") return <PermissionsScreen onDone={function(){setScreen("app");}}/>;
  return <MainApp initProfile={initProfile}/>;
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<SomFit/>);
</script>

// Register service worker for offline support
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      console.log("SW registered:",reg.scope);
    }).catch(function(e){
      console.warn("SW registration failed:",e);
    });
  });
}
</script>
