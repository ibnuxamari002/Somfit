// ── Current Firebase user uid (global, updated by onAuthStateChanged) ──
window.__sfUid=null;

// ── Persistence helper ──
// usePersist(key, defaultValue) — reads/writes localStorage AND syncs to Firestore
// when a user is signed in. Cloud data wins on first load after sign-in.
function usePersist(key,def){
  var full="sf:"+key;
  function load(){
    try{var v=localStorage.getItem(full);return v!==null?JSON.parse(v):def;}
    catch(e){return def;}
  }
  var pair=useState(load);
  var val=pair[0],setVal=pair[1];
  var initialSyncDone=useRef(false);

  // Write to localStorage on every change
  useEffect(function(){
    try{localStorage.setItem(full,JSON.stringify(val));}
    catch(e){}
  },[val]);

  // Write to Firestore whenever value changes and user is signed in
  useEffect(function(){
    if(!initialSyncDone.current)return; // don't write during initial cloud pull
    var uid=window.__sfUid;
    if(!uid||!window.__FB)return;
    var fb=window.__FB;
    fb.setDoc(fb.doc(fb.db,"users",uid,"data","appData"),{[key]:val},{merge:true})
      .catch(function(e){console.warn("Cloud sync write failed:",key,e);});
  },[val]);

  return [val,function(newVal){
    initialSyncDone.current=true;
    setVal(newVal);
  }];
}

// ── Pull all user data from Firestore after sign-in ──
function pullCloudData(uid,setters){
  if(!uid||!window.__FB)return;
  var fb=window.__FB;
  fb.getDoc(fb.doc(fb.db,"users",uid,"data","appData")).then(function(snap){
    if(!snap.exists())return;
    var d=snap.data();
    // Apply each field to its setter if present
    Object.keys(setters).forEach(function(k){
      if(d[k]!==undefined){
        try{localStorage.setItem("sf:"+k,JSON.stringify(d[k]));}catch(e){}
        setters[k](d[k]);
      }
    });
  }).catch(function(e){console.warn("Cloud pull failed:",e);});
}

// ── Shared Components ──
function GlowRing({pct,size,stroke,grad,label,sub}){
  size=size||90; stroke=stroke||9;
  const r=(size-stroke)/2,circ=2*Math.PI*r;
  const id="gr"+Math.random().toString(36).slice(2);
  return(
    <div style={{position:"relative",width:size,height:size,flexShrink:0}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <defs><linearGradient id={id} x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stopColor={grad[0]}/><stop offset="100%" stopColor={grad[1]}/>
        </linearGradient></defs>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#1E2640" strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={"url(#"+id+")"} strokeWidth={stroke}
          strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} strokeLinecap="round"/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
        <div style={{fontSize:size*0.2,fontWeight:900,background:"linear-gradient(135deg,"+grad[0]+","+grad[1]+")",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",lineHeight:1}}>{label}</div>
        {sub&&<div style={{fontSize:size*0.11,color:C.muted,marginTop:1}}>{sub}</div>}
      </div>
    </div>
  );
}

function Pill({color,bg,children}){
  return <span style={{display:"inline-flex",alignItems:"center",padding:"3px 10px",borderRadius:20,background:bg||color+"18",border:"1px solid "+color+"44",fontSize:10,fontWeight:700,color:color}}>{children}</span>;
}

function GlassCard({children,style}){
  var bg=APP.dark?"#13131A":G.card;
  var br=APP.dark?"#2A2A3A":C.border;
  return <div style={Object.assign({borderRadius:20,padding:16,background:bg,border:"1px solid "+br,transition:"background 0.4s ease"},style||{})}>{children}</div>;
}

function BarChart({data,labels,height,goal}){
  height=height||90;
  const mx=Math.max(...data);
  const mxi=data.indexOf(mx);
  const GOAL=goal||10000;
  const labelH=16;
  const valH=18;
  const barArea=height;
  // goal line position
  const goalY=Math.round((GOAL/mx)*barArea);
  return(
    <div style={{display:"flex",flexDirection:"column",gap:0}}>
      {/* value labels row */}
      <div style={{display:"flex",alignItems:"flex-end",gap:3,height:valH,marginBottom:4}}>
        {data.map(function(v,i){
          const metGoal=v>=GOAL;
          return(
            <div key={i} style={{flex:1,textAlign:"center",fontSize:7.5,fontWeight:700,
              color:metGoal?"#4ADE80":"#F97316",letterSpacing:-0.3}}>
              {v>=10000?(v/1000).toFixed(1)+"k":v.toLocaleString()}
            </div>
          );
        })}
      </div>
      {/* bars + goal line */}
      <div style={{display:"flex",alignItems:"flex-end",gap:3,height:barArea,position:"relative"}}>
        {/* goal line */}
        <div style={{position:"absolute",left:0,right:0,bottom:goalY,pointerEvents:"none",zIndex:2}}>
          <div style={{borderTop:"1.5px solid #4ADE8088",width:"100%"}}/>
        </div>
        {data.map(function(v,i){
          const h=Math.round((v/mx)*barArea);
          const metGoal=v>=GOAL;
          const isBest=i===mxi;
          const barGrad=metGoal
            ?"linear-gradient(180deg,#6EF29A,#22C55E,#16A34A)"
            :"linear-gradient(180deg,#FB923C,#F97316,#EA580C)";
          const glowCol=metGoal?"#22C55E":"#F97316";
          return(
            <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-end",height:"100%",position:"relative"}}>
              <div style={{
                width:"100%",height:h,borderRadius:"5px 5px 0 0",
                background:barGrad,
                boxShadow:"0 -3px 12px "+glowCol+(isBest?"55":"22"),
                position:"relative",overflow:"hidden"
              }}>
                <div style={{position:"absolute",top:0,left:0,right:0,height:"35%",background:"linear-gradient(180deg,rgba(255,255,255,0.18),transparent)",borderRadius:"5px 5px 0 0"}}/>
              </div>
            </div>
          );
        })}
      </div>
      {/* labels row */}
      {labels&&<div style={{display:"flex",alignItems:"center",gap:3,height:labelH,marginTop:5}}>
        {labels.map(function(l,i){
          const metGoal=data[i]>=GOAL;
          return(
            <div key={i} style={{flex:1,textAlign:"center",fontSize:9,fontWeight:metGoal?800:500,
              color:metGoal?"#4ADE80":"#94A3B8"}}>
              {l}
            </div>
          );
        })}
      </div>}
    </div>
  );
}

function SparkLine({data,color1,color2,height}){
  height=height||70;
  const w=320,mx=Math.max(...data),mn=Math.min(...data);
  const pts=data.map(function(v,i){
    const x=i/(data.length-1)*w;
    const y=height-((v-mn)/(mx-mn||1))*(height-10)-5;
    return x+","+y;
  }).join(" ");
  const areaClose=" "+w+","+(height)+" 0,"+height;
  const id="sl"+Math.random().toString(36).slice(2);
  return(
    <svg width="100%" viewBox={"0 0 "+w+" "+height} preserveAspectRatio="none">
      <defs>
        <linearGradient id={id} x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stopColor={color1}/><stop offset="100%" stopColor={color2||color1}/>
        </linearGradient>
        <linearGradient id={id+"a"} x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stopColor={color1} stopOpacity="0.3"/><stop offset="100%" stopColor={color1} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <polygon points={pts+" "+areaClose} fill={"url(#"+id+"a)"}/>
      <polyline points={pts} fill="none" stroke={"url(#"+id+")"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

var GOOGLE_CLIENT_ID="824322486194-mhm0bphtf267bdf3tj22ehqck9lj9p3v.apps.googleusercontent.com";
function LoginScreen({onDone}){
  const [error,setError]=useState("");
  const [loading,setLoading]=useState(false);
  const googleBtnRef=useRef(null);

  useEffect(function(){
    function tryInit(){
      if(!window.__FB||!window.google||!window.google.accounts){setTimeout(tryInit,300);return;}
      var fb=window.__FB;
      window.google.accounts.id.initialize({
        client_id:GOOGLE_CLIENT_ID,
        callback:function(response){
          setLoading(true);
          var credential=fb.GoogleAuthProvider.credential(response.credential);
          fb.signInWithCredential(fb.auth,credential).then(function(r){
            var user=r.user;
            fb.setDoc(fb.doc(fb.db,"users",user.uid),{
              uid:user.uid,name:user.displayName||"",email:user.email||"",
              lastLogin:fb.serverTimestamp(),platform:"web"
            },{merge:true}).catch(function(){});
            try{localStorage.setItem("sf:googleUser",JSON.stringify({name:user.displayName,email:user.email||"",avatar:user.photoURL||"",uid:user.uid}));}catch(e){}
            setLoading(false);
            onDone();
          }).catch(function(e){setError("Google sign-in failed: "+e.message);setLoading(false);});
        }
      });
      if(googleBtnRef.current){
        window.google.accounts.id.renderButton(googleBtnRef.current,{theme:"filled_blue",size:"large",shape:"pill",width:300,text:"continue_with"});
      }
    }
    tryInit();
  },[]);

  return(
    <div style={{minHeight:"100vh",background:C.bg,padding:"48px 24px 40px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
      <div style={{textAlign:"center",marginBottom:48}}>

        <div style={{fontSize:30,fontWeight:900,background:G.hero,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",marginBottom:8}}>Welcome to Som Fit</div>
        <div style={{color:C.muted,fontSize:14}}>Sign in to sync your fitness data</div>
      </div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:16,width:"100%",maxWidth:320}}>
        {loading
          ?<div style={{color:C.green,fontSize:15,fontWeight:700}}>✅ Signing you in…</div>
          :<div ref={googleBtnRef} style={{minHeight:48,display:"flex",justifyContent:"center",width:"100%"}}></div>
        }
        {error&&<div style={{color:C.red,fontSize:13,textAlign:"center",padding:"10px 16px",borderRadius:12,background:C.red+"15",border:"1px solid "+C.red+"44"}}>{error}</div>}
      </div>
      <div style={{textAlign:"center",color:C.muted,fontSize:11,marginTop:32,lineHeight:1.7}}>By continuing you agree to our<br/>Terms of Service & Privacy Policy</div>
    </div>
  );
}

function PermissionsScreen({onDone}){
  const perms=[
    {icon:"🏃",l:"Motion & Fitness",desc:"Step count, workouts, activity rings",c:C.green},
    {icon:"❤️",l:"Heart Rate",desc:"Real-time BPM and cardio zones",c:C.pink},

    {icon:"📱",l:"Notifications",desc:"Workout reminders and goal alerts",c:C.amber}
  ];
  const [granted,setGranted]=useState([false,false,false,false]);
  const allGranted=granted.every(function(g){return g;});

  function toggle(i){
    setGranted(function(prev){
      const next=prev.slice();
      next[i]=!next[i];
      return next;
    });
  }

  function allowAll(){
    setGranted([true,true,true,true]);
  }

  return(
    <div style={{minHeight:"100vh",background:C.bg,padding:"50px 24px 40px",display:"flex",flexDirection:"column"}}>
      <div style={{fontSize:11,color:C.muted,fontWeight:700,letterSpacing:1,marginBottom:8}}>STEP 2 OF 2</div>

        <button onClick={allowAll} style={{background:"none",border:"none",color:C.cyan,fontSize:12,fontWeight:700,cursor:"pointer",letterSpacing:0.3,padding:"4px 0"}}>Allow All</button>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:40}}>

          const on=granted[i];
          return(

                background:on?p.c+"22":"#1565C0",

                display:"flex",alignItems:"center",justifyContent:"center",
                fontSize:24,flexShrink:0,
                boxShadow:on?"0 0 12px "+p.c+"44":"none",
                transition:"all 0.2s"
              }}>{p.icon}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:700,color:on?C.text:C.muted,marginBottom:2}}>{p.l}</div>
                <div style={{fontSize:11,color:C.dim}}>{p.desc}</div>
              </div>
              {/* Toggle pill */}
              <div onClick={function(e){e.stopPropagation();toggle(i);}} style={{
                width:52,height:28,borderRadius:14,
                background:on?p.c:"#1565C0",
                border:"1px solid "+(on?p.c:C.border),
                position:"relative",cursor:"pointer",
                boxShadow:on?"0 0 10px "+p.c+"66":"none",
                transition:"all 0.25s",flexShrink:0
              }}>
                <div style={{
                  position:"absolute",top:3,
                  left:on?26:3,
                  width:20,height:20,borderRadius:10,
                  background:on?"#0D47A1":"#1976D2",
                  boxShadow:"0 1px 4px rgba(13,71,161,0.4)",
                  transition:"left 0.25s"

              </div>
            </div>
          );
        })}
      </div>
      <div style={{marginTop:"auto"}}>
        {!allGranted&&<div style={{textAlign:"center",fontSize:12,color:C.muted,marginBottom:10}}>
          Enable all permissions for the best experience

          transition:"all 0.3s"
        }}>
          {allGranted?"Get Started 🚀":"Enable All Permissions"}
        </button>
      </div>
    </div>

  // ── Real pedometer via DeviceMotion accelerometer ──
  const pedometerRef=useRef({
    gx:0,gy:0,gz:0,   // low-pass gravity estimate
    prevMag:0,         // previous filtered magnitude
    rising:false,      // are we on upswing?
    lastStep:0,        // timestamp of last counted step
    window:[],         // rolling magnitude buffer for dynamic threshold
  });
  useEffect(function(){
    var ALPHA=0.8;        // low-pass filter coefficient (higher = smoother gravity)
    var COOLDOWN=300;     // min ms between steps
    var WINDOW_SIZE=20;   // samples for dynamic threshold
    function onMotion(e){
      var raw=e.accelerationIncludingGravity;
      if(!raw) return;
      var rx=raw.x||0, ry=raw.y||0, rz=raw.z||0;
      var ref=pedometerRef.current;
      // Update gravity estimate via low-pass filter
      ref.gx=ALPHA*ref.gx+(1-ALPHA)*rx;
      ref.gy=ALPHA*ref.gy+(1-ALPHA)*ry;
      ref.gz=ALPHA*ref.gz+(1-ALPHA)*rz;
      // Linear acceleration = raw - gravity
      var ax=rx-ref.gx, ay=ry-ref.gy, az=rz-ref.gz;
      var mag=Math.sqrt(ax*ax+ay*ay+az*az);
      // Maintain rolling window for dynamic threshold
      ref.window.push(mag);
      if(ref.window.length>WINDOW_SIZE) ref.window.shift();
      var avg=ref.window.reduce(function(a,b){return a+b;},0)/ref.window.length;
      var dynThreshold=avg*1.4; // step peak must be 40% above rolling average
      var minThreshold=1.5;     // absolute floor to ignore tiny vibrations
      var threshold=Math.max(dynThreshold,minThreshold);
      var now=Date.now();
      // Peak detection: rising then falling above threshold
      if(mag>ref.prevMag) {
        ref.rising=true;
      } else if(ref.rising&&ref.prevMag>threshold&&(now-ref.lastStep)>COOLDOWN){
        // We just passed a peak above threshold — count it
        ref.rising=false;
        ref.lastStep=now;
        setSteps(function(s){return s+1;});
      } else {
        ref.rising=false;
      }
      ref.prevMag=mag;
    }
    // Auto-start on Android; try auto-request on iOS too
    if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function"){
      // iOS 13+ — try auto-request (works if page was opened via user interaction)
      DeviceMotionEvent.requestPermission().then(function(r){
        if(r==="granted"){
          window.addEventListener("devicemotion",onMotion,{passive:true});
          setMotionGranted(true);
        }
      }).catch(function(){
        // iOS blocked auto-request — banner tap will handle it
      });
    } else if(typeof DeviceMotionEvent!=="undefined"){
      window.addEventListener("devicemotion",onMotion,{passive:true});
      setMotionGranted(true);
    }
    window._somfitStartPedometer=function(){
      window.addEventListener("devicemotion",onMotion,{passive:true});
      setMotionGranted(true);
    };

    var hrIv=setInterval(function(){
      setHr(function(h){return Math.max(60,Math.min(105,h+(Math.random()>0.5?1:-1)));});
    },3000);
    return function(){
      window.removeEventListener("devicemotion",onMotion);
      clearInterval(hrIv);
    };
  },[]);

      setGpsStatus("idle");
      return;
    }
    if(!navigator.geolocation){setGpsErr("GPS not supported on this device");setGpsStatus("denied");return;}
    setGpsStatus("acquiring");
    var watchId=navigator.geolocation.watchPosition(
      function(pos){
        setGpsStatus("tracking");
        setGpsCoords(function(prev){
          var newPt={lat:pos.coords.latitude,lng:pos.coords.longitude,ts:Date.now(),acc:pos.coords.accuracy};
          if(prev.length===0) return [newPt];
          var last=prev[prev.length-1];
          var R=6371000;
          var dLat=(newPt.lat-last.lat)*Math.PI/180;
          var dLng=(newPt.lng-last.lng)*Math.PI/180;
          var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(last.lat*Math.PI/180)*Math.cos(newPt.lat*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
          var seg=R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
          if(seg<10||pos.coords.accuracy>20) return prev;
          setGpsDist(function(d){return d+seg;});
          return prev.concat([newPt]);
        });
      },
      function(err){
        setGpsErr(err.code===1?"Location permission denied. Enable GPS in your browser settings.":"Unable to get GPS signal.");

        {/* TRACK TAB */}
        {tab==="track"&&<div style={{display:"flex",flexDirection:"column",gap:14}}>

                  <div style={{position:"absolute",top:18,left:"50%",transform:"translateX(-50%)",background:"rgba(0,0,0,0.55)",borderRadius:20,padding:"4px 16px",zIndex:1001,backdropFilter:"blur(4px)"}}>

            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              {[{icon:"🏃",label:"Running",grad:[C.green,C.cyan]},{icon:"🚴",label:"Cycling",grad:[C.cyan,C.blue]},{icon:"🚶",label:"Walking",grad:[C.purple,C.purpleLight]},{icon:"⚡",label:"HIIT",grad:[C.pink,C.amber]}].map(function(w,i){
                return <button key={i} onClick={function(){workoutStepsStart.current=steps;setWorkout(w.label);setWTime(0);setGpsCoords([]);setGpsDist(0);setTab("track");}} style={{padding:"20px",borderRadius:20,border:"1px solid "+w.grad[0]+"44",background:"linear-gradient(135deg,"+w.grad[0]+"12,"+w.grad[1]+"08)",cursor:"pointer",textAlign:"center"}}>
                  <div style={{fontSize:36,marginBottom:8}}>{w.icon}</div>
                  <div style={{fontSize:14,fontWeight:700,background:"linear-gradient(90deg,"+w.grad[0]+","+w.grad[1]+")",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>{w.label}</div>
                </button>;
              })}
            </div>

            {/* ── INTERVAL TIMER ── */}
            {(function(){
              var isActive=itMode==="work"||itMode==="rest";

                ?(itMode==="work"?"linear-gradient(145deg,#2D1A00,#1A1200)":"linear-gradient(145deg,#001A2D,#000D1A)")

              var glowCol=isActive?col+"55":"rgba(255,255,255,0.04)";
              return(
                <div style={{borderRadius:26,overflow:"hidden",background:bgGrad,border:"1px solid "+(isActive?col+"66":"rgba(255,255,255,0.12)"),boxShadow:"0 0 32px "+glowCol+", 0 8px 32px rgba(0,0,0,0.4)",transition:"all 0.5s"}}>

                  {/* Header */}

                    {!isActive&&!isDone&&<button onClick={function(){setItEdit(function(v){return !v;});setItEditCfg(itCfg);}} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:10,padding:"5px 12px",color:C.muted,fontSize:11,cursor:"pointer",fontWeight:700}}>⚙ Edit</button>}
                    {isDone&&<button onClick={function(){setItMode("idle");setItRound(0);setItSec(0);}} style={{background:C.green+"22",border:"1px solid "+C.green+"55",borderRadius:10,padding:"5px 12px",color:C.green,fontSize:11,fontWeight:800,cursor:"pointer"}}>↺ Reset</button>}
                    {isActive&&<button onClick={function(){setItMode("idle");setItRound(0);setItSec(0);}} style={{background:C.red+"22",border:"1px solid "+C.red+"44",borderRadius:10,padding:"5px 12px",color:C.red,fontSize:11,fontWeight:800,cursor:"pointer"}}>✕ Stop</button>}
                  </div>

                  {/* Edit panel */}
                  {itEdit&&!isActive&&!isDone&&(function(){
                    function adj(field,delta){
                      setItEditCfg(function(c){
                        var mins={work:5,rest:5,rounds:1};
                        var maxs={work:300,rest:300,rounds:20};
                        var v=Math.max(mins[field],Math.min(maxs[field],c[field]+delta));
                        var n=Object.assign({},c);n[field]=v;return n;

                              </div>
                            </div>

                      </div>

                  {/* Timer body */}
                  <div style={{padding:"18px 16px 20px",display:"flex",alignItems:"center",gap:20}}>
                    {/* Ring */}
                    <div style={{position:"relative",flexShrink:0,width:118,height:118}}>

                      <svg width="118" height="118" style={{transform:"rotate(-90deg)"}}>
                        <circle cx="59" cy="59" r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="9"/>
                        <circle cx="59" cy="59" r={r} fill="none"
                          stroke={isDone?C.green:isActive?col:"rgba(255,255,255,0.2)"}
                          strokeWidth="9" strokeLinecap="round"
                          strokeDasharray={circ}
                          strokeDashoffset={isActive?(circ-dash):0}

                      </div>
                    </div>

                    {/* Right stats + button */}
                    <div style={{flex:1,display:"flex",flexDirection:"column",gap:8}}>
                      {isDone
                        ?<div style={{textAlign:"center",padding:"8px 0"}}>

                          <div style={{fontSize:12,color:C.muted,marginTop:6}}>{itCfg.rounds} rounds · {Math.round((itCfg.work+itCfg.rest)*itCfg.rounds/60)} min total</div>

                        :(function(){

                      }} style={{
                        padding:"12px",borderRadius:16,border:"none",cursor:"pointer",fontWeight:900,fontSize:14,
                        background:isActive?"linear-gradient(135deg,"+C.red+","+C.pink+")":"linear-gradient(135deg,"+C.amber+","+C.pink+")",
                        color:"#000",marginTop:4,
                        boxShadow:isActive?"0 4px 20px "+C.red+"55":"0 4px 20px "+C.amber+"55",

                      }}>{isActive?"⏸ Pause":"▶ Start"}</button>}
                    </div>
                  </div>

                  {(isActive||isDone)&&<div style={{display:"flex",justifyContent:"center",gap:6,paddingBottom:16,flexWrap:"wrap",paddingLeft:14,paddingRight:14}}>

function SomFit(){
  const [screen,setScreen]=useState("splash");
  const [initProfile,setInitProfile]=useState(null);
  var returning=getHasOnboarded();
  // Splash → login (new users) or app (returning signed-in users)
  if(screen==="splash") return <SplashScreen onDone={function(){
    var cached=null;
    try{var s=localStorage.getItem("sf:googleUser");if(s)cached=JSON.parse(s);}catch(e){}
    var isSignedIn=!!window.__sfUid||!!cached;
    if(returning&&isSignedIn) setScreen("app");
    else if(returning&&!isSignedIn) setScreen("login");
    else setScreen("login"); // new user: always login first
  }}/>;
  if(screen==="login") return <LoginScreen onDone={function(){setScreen(returning?"app":"profile");}}/>;
  if(screen==="profile") return <ProfileScreen onDone={function(p){setInitProfile(p);setScreen("permissions");}}/>;
  if(screen==="permissions") return <PermissionsScreen onDone={function(){setScreen("app");}}/>;
  return <MainApp initProfile={initProfile}/>;
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<SomFit/>);

if("serviceWorker" in navigator){
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(reg){ reg.unregister(); });
  });
}
</script>
